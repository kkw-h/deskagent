# 评测集：开始菜单里的真实应用快捷方式
#
# 来源：C:\ProgramData\...\Start Menu\Programs + %APPDATA%\...\Start Menu\Programs
# 这批样本从未参与内置规则包的编写，是独立的泛化测试集。
#
# 筛选口径（三条，都是为了让指标反映「桌面上的真实情况」）：
#   1. 只保留 target 非空的条目。桌面上的 .lnk 一定有目标路径；
#      开始菜单里 target 为空的多是 shell: 或 ::{CLSID} 链接（控制面板、任务管理器等），
#      属于另一种数据结构，混进来会把「解析能力缺口」算成「分类错误」。
#   2. 剔除卸载 / 帮助 / 文档 / 官网 / 反馈类条目。这些只存在于开始菜单，
#      桌面上不会出现，且分组归属本身没有客观答案。
#   3. 剔除无法识别的条目（GX.lnk 指向 D:\GX，无法判断是什么）。
#
# 分组口径：
#   开发  = 编程、命令行、虚拟化、SDK、API 调试
#   工具  = 系统增强、压缩、驱动、远程、加速器、硬件配套
#   影音  = 音视频播放与内容平台
#   办公  = 文档协作、办公套件、AI 助手
#   创作  = 音视频/图形生产工具
#   社交  = 即时通讯
#   游戏  = 游戏平台与游戏本体
#   浏览器 = 网页浏览器

