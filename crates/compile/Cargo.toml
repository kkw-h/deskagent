[package]
name = "deskagent-compile"
version.workspace = true
# 显式声明 2021：workspace 默认是 2024（PecoFence 要求），
# 这些 crate 是 deskagent 原有代码，升 edition 需要单独验证。
edition = "2021"
license.workspace = true

[dependencies]
deskagent-classify = { path = "../classify" }
# 直接产出 PecoFence 原生的 Cond / Rule 结构，不再拼 JSON 或命令行参数。
# pecofence-core 是纯 Rust、无 Windows 依赖，跨 edition 引用没有问题。
pecofence-core = { path = "../core" }
serde.workspace = true
serde_json.workspace = true
