[package]
name = "pecofence"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "PecoFence: group your desktop icons into glass fences on Windows 11."
build = "build.rs"

[[bin]]
name = "pecofence"
path = "src/main.rs"

[dependencies]
windows-core = { workspace = true }
windows-webview = { workspace = true }
uuid = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
pecofence-core = { path = "../core" }
pecofence-ipc = { path = "../ipc" }
pecofence-platform = { path = "../platform" }
pecofence-render = { path = "../render" }
# DeskAgent 的语义分类现在跑在应用里：读 .lnk 目标 / PE 版本信息（scan），
# 匹配内置规则包（classify），按分组顺序排版（compile 的 GROUP_ORDER）。
# 全是纯 Rust，不引入新的系统依赖。
deskagent-scan = { path = "../scan" }
deskagent-classify = { path = "../classify" }
deskagent-compile = { path = "../compile" }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
