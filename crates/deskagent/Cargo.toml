[package]
name = "deskagent"
version.workspace = true
# 显式声明 2021：workspace 默认是 2024（PecoFence 要求），
# 这些 crate 是 deskagent 原有代码，升 edition 需要单独验证。
edition = "2021"
license.workspace = true

[[bin]]
name = "deskagent"
path = "src/main.rs"

[dependencies]
deskagent-scan = { path = "../scan" }
deskagent-classify = { path = "../classify" }
deskagent-compile = { path = "../compile" }
deskagent-pecofence = { path = "../pecofence" }
deskagent-llm = { path = "../llm" }
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
