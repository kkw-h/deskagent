  # 输入法归工具，不归办公：豆包输入法、搜狗输入法都带着「办公厂商」的公司名，
  # 靠公司名会误判，必须用产品类型先截住，所以优先级要高于办公的公司名规则。
  - group: 工具
    priority: 125
    match:
      name_contains:
        - '输入法'
