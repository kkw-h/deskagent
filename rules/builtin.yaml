        - '\charles\'
        - '\navicat\'
        - '\dbeaver\'
        - '\heidisql\'
        - '\pgadmin\'
        - '\mongodb\'
        - '\sysinternals\'
        - '\wechatwebdevtools\'
        - '微信web开发者工具'
        - '\workbuddy'
        - '\unity\'
        - '\unreal engine\'

  - group: 开发
    priority: 120
    match:
      company:
        - 'Zed Industries'
        - 'JetBrains'
        - 'VMware'
        - 'Docker'
        - 'Postman'
        - 'Yaak'
        - 'GitHub'
        - 'Brecht Sanders'
        - 'The Git Development Community'
        - 'Python Software Foundation'
        - 'Node.js'
        - 'Eclipse Foundation'
        - 'Sublime'
