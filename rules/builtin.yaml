# DeskAgent 内置分类规则包
#
# 匹配顺序：priority 从高到低，命中即停；同一规则内按 company → target → name → ext 顺序试。
#
# 三类信号的分工：
#   target_contains  最强。指向安装目录，能区分同一厂商的不同产品。
#   company          次强。但 Microsoft / Google 这类大厂名太泛，不能单独作为判据。
#   name_contains    兜底。专治「多个快捷方式指向同一个宿主进程」的情况——
#                    cmd.exe 和 powershell.exe 下挂着一堆开发工具入口，路径完全一样，
#                    只有文件名能区分。
#
# 路径片段一律不写开头的反斜杠：`microsoft visual studio\installer` 里 "visual"
# 前面是空格不是分隔符，写 `\visual studio\` 会漏。

rules:
  # ================================================================ 游戏
  - group: 游戏
    priority: 130
    match:
      target_contains:
        - 'steam://'
        - 'steamapps'
        - '\steam\'
        - '\steamtools\'
        - '\wegame\'
        - '\wegameapps\'
        - '\epic games\launcher\'
        - '\battle.net\'
        - '\riot games\'
        - '\ubisoft\'
        - '\electronic arts\'
        - '\ea app\'
        - '\gog galaxy\'
        - '\itch\'
        - '\hoyoplay\'
        - '\mihoyo\'
        - '\tencent\games\'
        - '\netease\games\'

  - group: 游戏
    priority: 120
    match:
      company:
        - 'Valve'
        - 'Epic Games'
        - 'Blizzard'
        - 'Riot Games'
        - 'Ubisoft'
        - 'Electronic Arts'
        - 'miHoYo'
        - 'Cognosphere'

  - group: 游戏
    priority: 100
    match:
      name_contains:
        - '英雄联盟'
        - '原神'
        - '崩坏'
        - '绝区零'
        - '我的世界'
        - '双点'
        - '黑神话'
        - '赛博朋克'
        - 'steam'
        - 'wegame'

  # ================================================================ 浏览器
  - group: 浏览器
    priority: 130
    match:
      target_contains:
        - '\google\chrome\'
        - '\microsoft\edge\'
        - '\mozilla firefox\'
        - '\bravesoftware\'
        - '\quark'
        - '\360se\'
        - '\360chrome\'
        - '\sogouexplorer\'
        - '\opera\'
        - '\vivaldi\'
        - '\arc\'

  - group: 浏览器
    priority: 120
    match:
      company:
        - 'Mozilla'
        - 'Brave Software'
        - 'The Quark Authors'

  - group: 浏览器
    priority: 100
    match:
      name_contains:
        - '浏览器'
        - 'chrome'
        - 'firefox'

  # ================================================================ 开发
  # 编辑器 / IDE
  - group: 开发
    priority: 135
    match:
      target_contains:
        - '\microsoft vs code\'
        - 'microsoft visual studio\'
        - '\visual studio\'
        - '\jetbrains\'
        - '\intellij'
        - '\pycharm'
        - '\webstorm'
        - '\goland'
        - '\clion\'
        - '\rider\'
        - '\phpstorm'
        - '\android studio'
        - '\sublime text'
        - '\notepad++'
        - '\neovim\'
        - '\cursor\'
        - '\zed\'
        - '\fleet\'
        - '\eclipse\'
        - '\electron\'
        - 'node_modules\electron'

  # 终端 / 版本控制 / 运行时 / SDK
  - group: 开发
    priority: 132
    match:
      target_contains:
        - '\git\'
        - '\github desktop\'
        - '\sourcetree\'
        - '\tortoisegit'
        - '\nodejs\'
        - '\nvm\'
        - '\python\'
        - '\anaconda'
        - '\miniconda'
        - '\java\'
        - '\jdk'
        - '\maven\'
        - '\gradle\'
        - '\rustup\'
        - '\go\bin\'
        - '\docker\'
        - '\podman\'
        - '\windows kits\'
        - 'windowspowershell'
        - '\android\sdk'
        - '\cmder\'
        - '\conemu\'
        - '\alacritty\'
        - '\wezterm\'
        - '\tabby\'

  # 虚拟化 / 远程调试 / 抓包 / 数据库客户端
  - group: 开发
    priority: 130
    match:
      target_contains:
        - '\vmware\'
        - '\virtualbox\'
        - '\qemu\'
        - '\putty\'
        - '\mobaxterm'
        - '\xshell\'
        - '\xftp\'
        - '\finalshell'
        - '\termius\'
        - '\winscp\'
        - '\filezilla\'
        - '\postman\'
        - '\apifox\'
        - '\yaak\'
        - '\insomnia\'
        - '\wireshark\'
